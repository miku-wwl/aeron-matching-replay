apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-worker
  namespace: job-demo
  labels:
    app.kubernetes.io/name: job-scheduler-keda-demo
    app.kubernetes.io/component: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: job-scheduler-keda-demo
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-scheduler-keda-demo
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: job-scheduler-keda-demo:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: demo-config
            - secretRef:
                name: demo-secret
          env:
            - name: APP_ROLE
              value: worker
            - name: APP_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
