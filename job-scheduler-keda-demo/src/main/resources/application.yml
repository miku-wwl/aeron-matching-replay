spring:
  application:
    name: job-scheduler-keda-demo
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:15673}
    username: ${SPRING_RABBITMQ_USERNAME:jobdemo}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 10s
    listener:
      simple:
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false
        missing-queues-fatal: false
  lifecycle:
    timeout-per-shutdown-phase: 35s
  jackson:
    time-zone: UTC

server:
  port: 8080
  shutdown: graceful

app:
  role: ${APP_ROLE:api}
  worker:
    id: ${APP_WORKER_ID:${HOSTNAME:local-worker}}
  rabbit:
    ready-queue: demo.jobs.ready

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,rabbit
        liveness:
          include: livenessState
  health:
    rabbit:
      enabled: true

logging:
  pattern:
    level: "%5p [role=${APP_ROLE:api}]"
